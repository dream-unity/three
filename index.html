<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dream Universe — Create &amp; connect. In preparation.">
  <meta name="theme-color" content="#ebe4d5">
  <link rel="canonical" href="https://dreamuniverse.one/">
  <title>Dream Universe</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; color: #28251f; background: #ebe4d5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; max-width: 72rem; margin: auto; padding: clamp(2rem, 7vw, 6rem) 1.5rem; display: flex; flex-direction: column; justify-content: center; gap: clamp(4rem, 12vh, 8rem); }
    header { text-align: center; }
    .caption { margin: 0 0 1.5rem; font-size: .875rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.7rem, 8vw, 6rem); font-weight: 400; line-height: 1.08; letter-spacing: -.035em; text-wrap: balance; }
    .status { margin: 2rem 0 0; font-size: 1.125rem; font-style: italic; line-height: 1.6; }
    nav { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 1rem; border-top: 1px solid #ada393; padding-top: 2rem; }
    nav a { color: inherit; text-decoration: none; text-align: center; padding: 1rem .5rem; border-bottom: 1px solid transparent; border-radius: 2px; }
    nav a:hover { border-bottom-color: currentColor; }
    nav a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    nav a[aria-current="page"] { border-bottom-color: currentColor; }
    nav strong { display: block; font-size: clamp(1.05rem, 2.2vw, 1.4rem); font-weight: 400; line-height: 1.4; }
    nav small { display: block; margin-top: .6rem; font-size: .875rem; line-height: 1.5; }
    .arrow { font-size: 1.4rem; }
    @media (max-width: 42rem) {
      main { padding: 3rem 1.5rem; gap: 3rem; }
      nav { grid-template-columns: 1fr; gap: .3rem; padding-top: 1.5rem; justify-items: center; }
      nav a { width: min(100%, 22rem); }
      .arrow { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="caption">Create &amp; connect</p>
      <h1>Dream Universe</h1>
      <p class="status">In preparation.</p>
    </header>
    <nav aria-label="Dream progression">
      <a href="https://dreamunity.one/"><strong>Dream Unity</strong><small>Foundations</small></a>
      <span class="arrow" aria-hidden="true">→</span>
      <a href="https://dreamuniversity.one/"><strong>Dream University</strong><small>Study &amp; discovery</small></a>
      <span class="arrow" aria-hidden="true">→</span>
      <a href="https://dreamuniverse.one/" aria-current="page"><strong>Dream Universe</strong><small>Create &amp; connect</small></a>
    </nav>
  </main>
</body>
</html>
